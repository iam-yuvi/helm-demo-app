apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
      - name: users
        image: users-img:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  type: NodePort
  selector: 
    app: users 
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
      nodePort: 30001
         
