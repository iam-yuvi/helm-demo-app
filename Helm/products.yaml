apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
      - name: products
        image: products-img:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
spec:
  type: NodePort
  selector: 
    app: products 
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
      nodePort: 30002
